[workspace]
members = [
  # Core
  "crates/core/fs-core",

  # Adapters
  "crates/adapters/vfs-adapter",
  "crates/adapters/rpc-adapter",

  # Hosts
  "crates/hosts/vfs-host",

  # Sync
  "crates/sync/vfs-sync-core",
  "crates/sync/vfs-sync-host",
  "crates/sync/vfs-sync-adapter",

  # RPC
  "crates/rpc/vfs-rpc-protocol",
  "crates/rpc/vfs-rpc-server",
  "crates/rpc/vfs-rpc-server-core",

  # Tools
  "crates/tools/monaka-cli",

  # Examples - Apps
  "examples/apps/demo-fs-operations",
  "examples/apps/demo-writer",
  "examples/apps/demo-reader",
  "examples/apps/demo-dirlist",
  "examples/static-composition/embed",

  # Use Cases - RPC Server
  "usecases/rpc-server/s3-sync-logging/logger",
  "usecases/rpc-server/ci-cache/ci-job",

  # Use Cases - Static Composition
  "usecases/static-composition/image-pipeline/image-processor",

  # Host Trait - native wasmtime hosts embedding vfs-host
  "examples/host-trait/runtime-linker",
  "examples/host-trait/runtime-linker-demo-fs",
  "examples/host-trait/runtime-linker-s3",
  "usecases/host-trait/concurrent-append/host-runner",
  "usecases/host-trait/http-cache/http-server",
  "usecases/host-trait/sensor-pipeline/runtime-linker",

  # Benchmarks - native wasmtime runners
  "benchmarks/all-methods/bench-runner",
  "benchmarks/lock-strategy/bench-runner",
  "benchmarks/s3-sync-all-methods/bench-runtime",
]
default-members = [
  "crates/core/fs-core",
  "crates/hosts/vfs-host",
  "crates/rpc/vfs-rpc-protocol",
]
exclude = [
  ".tmp",
  "test-app",
  "test-simple",
  "vfs-rpc-client",
  "vfs-tcp-server",
  "usecases/benchmarks",
]
resolver="3"

# wasmtime-wasi's traits are written against the wasmtime types of the same
# release, so every crate that touches them must agree on one version.
[workspace.dependencies]
wasmtime = "50.0.0"
wasmtime-wasi = "50.0.0"
wasmtime-wasi-io = "50.0.0"

[profile.dev]
opt-level = 1

# Workaround for rust-lld crash with crc-fast on wasm32-wasip2
# https://github.com/llvm/llvm-project/issues/ (lld::wasm::ElemSection::writeBody)
[profile.release.package.crc-fast]
opt-level = 1
