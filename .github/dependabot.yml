version: 2

updates:
  # Rust / Cargo dependencies (wasmtime, wit-bindgen, serde, ...).
  # Patch / minor / major updates land as separate PRs labelled "deps" so
  # release-please routes them into the dependency changelog section.
  - package-ecosystem: cargo
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: deps
      include: scope
    # wasmtime-wasi's traits are written against the wasmtime types of the
    # same release, so bumping one crate alone leaves two wasmtime versions
    # in the graph and vfs-host stops compiling. Update them as one PR.
    groups:
      wasmtime:
        patterns:
          - "wasmtime"
          - "wasmtime-*"

  # GitHub Actions used in the workflows (checkout, rust-toolchain, ...).
  # Action updates often carry node-version or security fixes; keep them
  # fresh without manual auditing.
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    commit-message:
      prefix: ci
      include: scope
