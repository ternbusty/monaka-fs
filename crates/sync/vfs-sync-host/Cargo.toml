[package]
name = "vfs-sync-host"
version = "0.2.5"
edition = "2021"
description = "S3 synchronization for Monaka VFS (native environment)"
license = "MIT"
repository = "https://github.com/ternbusty/monaka-fs"

[dependencies]
vfs-sync-core = { version = "0.2.5", path = "../vfs-sync-core" }
fs-core = { version = "0.2.5", path = "../../core/fs-core", features = ["thread-safe"] }
log = "0.4"

# AWS SDK for native use. Keep the default features of aws-sdk-s3 except
# "rustls", which only compiles in the deprecated rustls 0.21 legacy
# connector; the SDK already uses the rustls 0.23 based default-https-client
# at runtime.
aws-sdk-s3 = { version = "1", default-features = false, features = [
    "sigv4a",
    "http-1x",
    "default-https-client",
    "rt-tokio",
] }
aws-config = "1"
