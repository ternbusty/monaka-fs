[package]
name = "bench-runtime-08"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench-runtime-08"
path = "src/main.rs"

[dependencies]
vfs-host = { path = "../../../crates/hosts/vfs-host", features = ["s3-sync"] }
wasmtime.workspace = true
wasmtime-wasi.workspace = true
anyhow = "1.0"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "time"] }
env_logger = "0.11"
log = "0.4"
