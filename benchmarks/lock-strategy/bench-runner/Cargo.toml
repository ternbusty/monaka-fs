[package]
name = "bench-lock-runner"
version = "0.1.0"
edition = "2021"

[[bin]]
name = "bench-fine"
path = "src/bench_fine.rs"

[dependencies]
# WASM runtime
wasmtime = { workspace = true, features = ["component-model"] }
wasmtime-wasi.workspace = true

# VFS host implementation (fine-grained locking)
vfs-host = { path = "../../../crates/hosts/vfs-host" }

# Utilities
anyhow = "1.0"
